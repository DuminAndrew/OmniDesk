<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Градиент для фона (Темный современный стиль) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E2028"/>
      <stop offset="100%" stop-color="#0F1115"/>
    </linearGradient>

    <!-- Градиент для мессенджеров (Телеграм / ВК стиль) -->
    <linearGradient id="chatGrad" x1="50" y1="120" x2="330" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00C6FF"/>
      <stop offset="100%" stop-color="#0072FF"/>
    </linearGradient>

    <!-- Градиент для CRM (Современный фиолетовый/розовый) -->
    <linearGradient id="crmGrad" x1="210" y1="220" x2="470" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#B06AB3"/>
      <stop offset="100%" stop-color="#4568DC"/>
    </linearGradient>

    <!-- Легкая тень для объема -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Фон иконки (Скругленный квадрат в стиле macOS / Win11) -->
  <rect x="16" y="16" width="480" height="480" rx="110" fill="url(#bgGrad)"/>

  <!-- Задний бабл (Мессенджеры) -->
  <g>
    <!-- Хвостик чата -->
    <path d="M 110 240 L 50 300 L 150 300 Z" fill="url(#chatGrad)"/>
    <!-- Основное тело чата -->
    <rect x="110" y="120" width="220" height="160" rx="45" fill="url(#chatGrad)"/>
    
    <!-- Индикация набора текста (3 точки) -->
    <circle cx="170" cy="200" r="14" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="220" cy="200" r="14" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="270" cy="200" r="14" fill="#FFFFFF" opacity="0.9"/>
  </g>

  <!-- Передний бабл (CRM и задачи) с тенью -->
  <g filter="url(#dropShadow)">
    <!-- Хвостик чата CRM -->
    <path d="M 410 320 L 470 380 L 370 380 Z" fill="url(#crmGrad)"/>
    <!-- Основное тело чата CRM -->
    <rect x="210" y="220" width="200" height="140" rx="40" fill="url(#crmGrad)"/>
    
    <!-- Иконка галочки (Успех / Обработано в CRM) -->
    <path d="M 270 295 L 295 320 L 350 260" stroke="#FFFFFF" stroke-width="18" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Блик для премиальности -->
  <path d="M 16 126 C 16 65 65 16 126 16 L 386 16 C 447 16 496 65 496 126 C 300 200 100 150 16 300 Z" fill="#FFFFFF" opacity="0.03" style="pointer-events: none;"/>
</svg>
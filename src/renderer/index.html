<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>OmniDesk</title>
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self' omnidesk:;
                 style-src 'self' 'unsafe-inline' https://rsms.me;
                 font-src 'self' https://rsms.me data:;
                 script-src 'self';
                 img-src 'self' data: blob: https: omnidesk:;
                 media-src 'self' blob: https: omnidesk:;
                 connect-src 'self' https: omnidesk:;" />
  <link rel="stylesheet" href="styles/tokens.css" />
  <link rel="stylesheet" href="styles/reset.css" />
  <link rel="stylesheet" href="styles/layout.css" />
  <link rel="stylesheet" href="styles/components.css" />
  <link rel="stylesheet" href="styles/animations.css" />
</head>
<body>
  <div id="app"></div>

  <!-- ═══════════ Onboarding ═══════════ -->
  <template id="tpl-onboarding">
    <div class="onboarding">
      <div class="onboarding__brand">
        <img src="assets/icon.svg" alt="" class="onboarding__logo"/>
        <h1>OmniDesk</h1>
        <p class="muted">Единый центр для Telegram + ВКонтакте · CRM · Заметки</p>
      </div>

      <div class="onboarding__steps">
        <button class="step-card" data-step="proxy">
          <div class="step-card__icon">🌐</div>
          <div>
            <div class="step-card__title">Прокси для Telegram</div>
            <div class="step-card__sub" data-bind="proxy-status">не настроен</div>
          </div>
          <div class="step-card__chevron">›</div>
        </button>
        <button class="step-card" data-step="telegram">
          <div class="step-card__icon">✈️</div>
          <div>
            <div class="step-card__title">Подключить Telegram</div>
            <div class="step-card__sub" data-bind="tg-status">не подключён</div>
          </div>
          <div class="step-card__chevron">›</div>
        </button>
        <button class="step-card" data-step="vk">
          <div class="step-card__icon">🌀</div>
          <div>
            <div class="step-card__title">Подключить ВКонтакте</div>
            <div class="step-card__sub" data-bind="vk-status">не подключён</div>
          </div>
          <div class="step-card__chevron">›</div>
        </button>
      </div>

      <button class="btn btn--primary onboarding__continue" data-action="enter-app">
        Перейти в OmniDesk
      </button>
    </div>
  </template>

  <!-- ═══════════ Modal: Proxy ═══════════ -->
  <template id="tpl-proxy-modal">
    <div class="modal">
      <div class="modal__card modal__card--wide">
        <h2>Прокси для Telegram</h2>

        <details class="guide">
          <summary>📖 Когда нужен прокси</summary>
          <ol class="guide__list">
            <li>Если Telegram заблокирован у провайдера (актуально для РФ).</li>
            <li>MTProxy бесплатно: <a href="#" data-link="https://t.me/mtproto_proxies">@mtproto_proxies</a> или <a href="#" data-link="https://mtpro.xyz/ru/">mtpro.xyz/ru</a>.</li>
            <li>SOCKS5 — любой платный или собственный.</li>
            <li>После сохранения переподключите Telegram (Настройки → Telegram → Подключить).</li>
          </ol>
        </details>

        <label class="field">
          <span>Тип</span>
          <select data-field="type">
            <option value="none">Без прокси</option>
            <option value="mtproxy">MTProxy</option>
            <option value="socks5">SOCKS5</option>
          </select>
        </label>

        <div class="field-row">
          <label class="field"><span>Хост</span><input data-field="host" placeholder="proxy.example.com" /></label>
          <label class="field"><span>Порт</span><input data-field="port" placeholder="443" inputmode="numeric" /></label>
        </div>

        <label class="field" data-only="mtproxy">
          <span>Secret (HEX, ee… / dd…)</span>
          <input data-field="secret" placeholder="ee0123abcd..." />
        </label>

        <div class="field-row" data-only="socks5">
          <label class="field"><span>Логин (опц.)</span><input data-field="username" /></label>
          <label class="field"><span>Пароль (опц.)</span><input type="password" data-field="password" /></label>
        </div>

        <div class="modal__actions">
          <button class="btn btn--ghost" data-action="cancel">Отмена</button>
          <button class="btn btn--primary" data-action="save">Сохранить</button>
        </div>
      </div>
    </div>
  </template>

  <!-- ═══════════ Modal: Telegram login ═══════════ -->
  <template id="tpl-tg-modal">
    <div class="modal">
      <div class="modal__card modal__card--wide">
        <h2>Подключение Telegram</h2>

        <button class="btn btn--accent" data-action="open-telegram-org" style="align-self:flex-start">
          🔗 Открыть my.telegram.org внутри OmniDesk
        </button>
        <p class="muted small" style="margin-top:-6px">Если в обычном браузере получаете ERROR — кликните выше: откроется чистая встроенная сессия.</p>

        <details class="guide" open>
          <summary>📖 Как получить API ID и Hash</summary>
          <ol class="guide__list">
            <li>Откройте <a href="#" data-link="https://my.telegram.org/auth">my.telegram.org</a> и войдите по номеру.</li>
            <li>Нажмите <b>«API development tools»</b>.</li>
            <li>Заполните форму (кликните по значению — оно скопируется):
              <table class="guide__table">
                <tr><td><b>App title</b></td><td><code data-copy="OmniDesk">OmniDesk</code></td></tr>
                <tr><td><b>Short name</b></td><td><code data-copy="omnidesk_app">omnidesk_app</code> <span class="muted small">(любая 5–32 ascii строка)</span></td></tr>
                <tr><td><b>URL</b></td><td><code data-copy="https://github.com/DuminAndrew/OmniDesk">https://github.com/DuminAndrew/OmniDesk</code></td></tr>
                <tr><td><b>Platform</b></td><td><b>Desktop</b></td></tr>
                <tr><td><b>Description</b></td><td><span class="muted">оставьте пустым</span></td></tr>
              </table>
            </li>
            <li>Нажмите <b>«Create application»</b>. Если ERROR — обновите страницу, приложение часто всё равно создаётся.</li>
            <li>Скопируйте <b>App api_id</b> и <b>App api_hash</b> в поля ниже.</li>
            <li>Код подтверждения придёт в Telegram-чат «Telegram».</li>
          </ol>
        </details>

        <div data-stage="creds">
          <div class="field-row">
            <label class="field"><span>API ID (число)</span><input data-field="apiId" inputmode="numeric" placeholder="12345678" /></label>
            <label class="field"><span>API Hash (32 символа)</span><input data-field="apiHash" placeholder="abcdef1234567890..." /></label>
          </div>
          <label class="field"><span>Номер телефона</span><input data-field="phone" placeholder="+79001234567" /></label>
          <div class="modal__actions">
            <button class="btn btn--ghost" data-action="cancel">Отмена</button>
            <button class="btn btn--primary" data-action="send-code">Получить код</button>
          </div>
        </div>

        <div data-stage="code" hidden>
          <p class="muted">Код отправлен в Telegram-чат «Telegram».</p>
          <label class="field"><span>Код</span><input data-field="code" inputmode="numeric" /></label>
          <div class="modal__actions">
            <button class="btn btn--ghost" data-action="cancel">Отмена</button>
            <button class="btn btn--primary" data-action="submit-code">Подтвердить</button>
          </div>
        </div>

        <div data-stage="password" hidden>
          <p class="muted">Включена двухфакторная аутентификация. Введите облачный пароль:</p>
          <label class="field"><span>Пароль 2FA</span><input type="password" data-field="password" /></label>
          <div class="modal__actions">
            <button class="btn btn--ghost" data-action="cancel">Отмена</button>
            <button class="btn btn--primary" data-action="submit-password">Войти</button>
          </div>
        </div>

        <div data-stage="status" hidden>
          <div class="status-msg" data-bind="status-msg"></div>
        </div>
      </div>
    </div>
  </template>

  <!-- ═══════════ Modal: VK login ═══════════ -->
  <template id="tpl-vk-modal">
    <div class="modal">
      <div class="modal__card modal__card--wide">
        <h2>Подключение ВКонтакте</h2>

        <details class="guide" open>
          <summary>📖 Как получить access_token</summary>
          <ol class="guide__list">
            <li>Откройте <a href="#" data-link="https://vkhost.github.io/">vkhost.github.io</a>.</li>
            <li>Нажмите <b>«Kate Mobile»</b>.</li>
            <li>Войдите в VK → <b>«Разрешить»</b>.</li>
            <li>Скопируйте <b>весь URL</b> из адресной строки после редиректа:
              <pre class="guide__code">https://oauth.vk.com/blank.html#<b>access_token=vk1.a.XXX...</b>&amp;expires_in=0&amp;user_id=…</pre>
            </li>
            <li>Вставьте URL целиком — токен извлечётся автоматически.</li>
          </ol>
          <p class="muted small">⚠️ Токен даёт полный доступ к сообщениям. OmniDesk хранит его зашифрованным.</p>
        </details>

        <label class="field">
          <span>Access Token (или весь URL)</span>
          <input data-field="token" placeholder="vk1.a.XXXX… или https://oauth.vk.com/blank.html#…" />
        </label>
        <div class="modal__actions">
          <button class="btn btn--ghost" data-action="cancel">Отмена</button>
          <button class="btn btn--primary" data-action="save">Подключить</button>
        </div>
        <div class="status-msg" data-bind="status-msg"></div>
      </div>
    </div>
  </template>

  <!-- ═══════════ Main shell ═══════════ -->
  <template id="tpl-app-shell">
    <div class="shell">
      <aside class="sidebar">
        <div class="sidebar__brand">
          <div class="sidebar__logo"><img src="assets/icon.svg" alt=""/></div>
          <div>
            <div class="sidebar__title">OmniDesk</div>
            <div class="sidebar__sub">v1.0.0</div>
          </div>
        </div>
        <nav class="sidebar__nav">
          <button class="nav-item is-active" data-view="inbox">    <span data-icon="inbox"></span><span>Инбокс</span></button>
          <button class="nav-item"            data-view="crm">      <span data-icon="crm"></span><span>CRM</span></button>
          <button class="nav-item"            data-view="tasks">    <span data-icon="tasks"></span><span>Задачи</span><span class="nav-counter" data-bind="tasks-counter" hidden></span></button>
          <button class="nav-item"            data-view="notes">    <span data-icon="notes"></span><span>Заметки</span></button>
          <button class="nav-item"            data-view="settings"> <span data-icon="settings"></span><span>Настройки</span></button>
        </nav>
        <div class="sidebar__status">
          <div class="conn-pill" data-conn="tg"><span class="dot"></span>Telegram</div>
          <div class="conn-pill" data-conn="vk"><span class="dot"></span>VK</div>
        </div>
      </aside>

      <main class="workspace" data-view-host></main>
    </div>
  </template>

  <!-- ═══════════ View: Inbox ═══════════ -->
  <template id="tpl-view-inbox">
    <section class="view view--inbox">
      <div class="pane pane--chats">
        <div class="pane__head">
          <h2>Диалоги</h2>
          <div class="segmented" data-bind="segmented">
            <button class="segmented__btn is-active" data-source="all">Все</button>
            <button class="segmented__btn tg"        data-source="tg"><span data-icon="tg" data-icon-size="12"></span>Telegram</button>
            <button class="segmented__btn vk"        data-source="vk"><span data-icon="vk" data-icon-size="12"></span>VK</button>
          </div>
          <input class="search" placeholder="Поиск…" data-bind="search"/>
        </div>
        <div class="chat-list" data-bind="chat-list"></div>
      </div>
      <div class="pane pane--thread">
        <div class="thread-empty" data-bind="thread-empty">
          <div class="thread-empty__icon">💬</div>
          <div>Выберите диалог</div>
        </div>
        <div class="thread" data-bind="thread" hidden>
          <header class="thread__head">
            <div class="thread__title" data-bind="thread-title"></div>
            <div class="thread__source" data-bind="thread-source"></div>
          </header>
          <div class="thread__messages" data-bind="thread-messages"></div>
          <footer class="thread__composer">
            <textarea data-bind="composer" placeholder="Напишите сообщение… (Ctrl+Enter — отправить)"></textarea>
            <button class="btn btn--primary" data-action="send"><span data-icon="send"></span>Отправить</button>
          </footer>
        </div>
      </div>
      <div class="pane pane--side">
        <div class="card-stack" data-bind="side-panel">
          <div class="muted small" style="padding:18px">Откройте диалог, чтобы увидеть данные клиента, теги и заметки.</div>
        </div>
      </div>
    </section>
  </template>

  <!-- ═══════════ View: CRM ═══════════ -->
  <template id="tpl-view-crm">
    <section class="view view--crm">
      <div class="view__head">
        <h2>Клиенты</h2>
        <button class="btn btn--primary" data-action="new-client"><span data-icon="plus"></span>Новый клиент</button>
      </div>
      <div class="filters">
        <button class="filter is-active" data-status="">Все</button>
        <button class="filter" data-status="new">Новые</button>
        <button class="filter" data-status="in_progress">В работе</button>
        <button class="filter" data-status="closed">Закрытые</button>
        <button class="filter" data-status="rejected">Отказы</button>
      </div>
      <div class="client-grid" data-bind="client-grid"></div>
    </section>
  </template>

  <!-- ═══════════ View: Tasks ═══════════ -->
  <template id="tpl-view-tasks">
    <section class="view view--tasks">
      <div class="view__head">
        <h2>Задачи</h2>
        <button class="btn btn--primary" data-action="new-task"><span data-icon="plus"></span>Новая задача</button>
      </div>
      <div class="filters">
        <button class="filter is-active" data-status="pending">Активные</button>
        <button class="filter" data-status="today">Сегодня</button>
        <button class="filter" data-status="overdue">Просрочены</button>
        <button class="filter" data-status="completed">Завершены</button>
        <button class="filter" data-status="all">Все</button>
      </div>
      <div class="tasks-list" data-bind="tasks-list"></div>
    </section>
  </template>

  <!-- ═══════════ View: Notes ═══════════ -->
  <template id="tpl-view-notes">
    <section class="view view--notes">
      <div class="view__head">
        <h2>Заметки</h2>
        <select data-bind="client-filter"><option value="">Все клиенты</option></select>
      </div>
      <div class="notes-grid" data-bind="notes-grid"></div>
    </section>
  </template>

  <!-- ═══════════ View: Settings ═══════════ -->
  <template id="tpl-view-settings">
    <section class="view view--settings">
      <div class="view__head"><h2>Настройки</h2></div>
      <div class="settings-grid">
        <div class="settings-card">
          <h3><span data-icon="globe"></span>Прокси Telegram</h3>
          <div class="muted" data-bind="proxy-current">не настроен</div>
          <button class="btn btn--ghost" data-action="proxy">Настроить</button>
        </div>
        <div class="settings-card">
          <h3><span data-icon="tg"></span>Telegram</h3>
          <div class="muted" data-bind="tg-current">не подключён</div>
          <div class="row">
            <button class="btn btn--ghost" data-action="tg-connect">Подключить</button>
            <button class="btn btn--danger" data-action="tg-logout">Отключить</button>
          </div>
        </div>
        <div class="settings-card">
          <h3><span data-icon="vk"></span>ВКонтакте</h3>
          <div class="muted" data-bind="vk-current">не подключён</div>
          <div class="row">
            <button class="btn btn--ghost" data-action="vk-connect">Подключить</button>
            <button class="btn btn--danger" data-action="vk-logout">Отключить</button>
          </div>
        </div>
        <div class="settings-card">
          <h3><span data-icon="image"></span>Фон чатов</h3>
          <div class="muted small">Выбери приятный для глаз цвет/градиент. Применяется ко всем диалогам.</div>
          <div class="wallpaper-grid" data-bind="wallpaper-grid"></div>
        </div>

        <div class="settings-card">
          <h3><span data-icon="mic"></span>Расшифровка голосовых</h3>
          <div class="muted" data-bind="whisper-status">проверка…</div>
          <div data-bind="whisper-progress-wrap" hidden>
            <div class="muted small" data-bind="whisper-progress-label">…</div>
            <div class="whisper-progress"><div class="whisper-progress__bar" data-bind="whisper-progress-bar"></div></div>
          </div>
          <div class="row">
            <button class="btn btn--primary" data-action="whisper-install">Установить (~155 MB)</button>
          </div>
          <div class="muted small">Whisper.cpp + модель ggml-base. Работает локально, без интернета. Поддерживает русский и английский.</div>
        </div>
      </div>
    </section>
  </template>

  <div id="toasts" class="toasts"></div>

  <script type="module" src="scripts/app.js"></script>
</body>
</html>

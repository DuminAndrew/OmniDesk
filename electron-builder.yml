appId: com.omnidesk.app
productName: OmniDesk
copyright: "Copyright © 2026 OmniDesk"

directories:
  output: dist
  buildResources: build

files:
  - src/**/*
  - package.json
  - "!**/*.map"
  - "!node_modules/bufferutil/build/**"
  - "!node_modules/utf-8-validate/build/**"

# better-sqlite3 prebuilt for Electron is already in place; skip rebuild
npmRebuild: false

asarUnpack:
  - node_modules/better-sqlite3/**

extraResources:
  - from: build/icon.ico
    to: icon.ico
  - from: build/icon.png
    to: icon.png
  - from: build/tray.png
    to: tray.png

# OTA: electron-updater pulls latest.yml + new .exe from GitHub releases
publish:
  - provider: github
    owner: DuminAndrew
    repo: OmniDesk
    releaseType: release

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
  artifactName: "OmniDesk-Setup-${version}.${ext}"   # MUST match latest.yml URL (dashes, no spaces)
  publisherName: OmniDesk

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: OmniDesk
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  deleteAppDataOnUninstall: false

extraMetadata:
  main: src/main/main.js
